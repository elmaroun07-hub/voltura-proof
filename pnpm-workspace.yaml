packages:
  - artifacts/*
  - lib/*

# esbuild needs its postinstall to fetch the platform binary. pnpm 11 no longer
# reads `pnpm.onlyBuiltDependencies` from package.json, so without this the CI
# install fails with ERR_PNPM_IGNORED_BUILDS and the deploy never ships.
allowBuilds:
  esbuild: true

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: 4.6.7

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

