# Spain sources registry — H-SRC-ES, 15 Sept 2026.
#
# One entry per user-facing numeric constant that touches Spain. This file is
# the only place any of these numbers may be declared. The resolver in
# artifacts/api-server/src/lib/emissions/ reads it at startup and refuses to
# emit a figure whose id is not present here with status: current.
#
# Field meaning, per entry:
#   id                     stable identifier, referenced by code and tests
#   value                  the number, in `unit` — null for a pending entry
#   unit                   the value's unit — null for a pending entry
#   basis                  what KIND of quantity this is (see below). Two
#                          entries can carry the same country and year and
#                          still be a 2.4x apart because they answer different
#                          questions — basis is what keeps them from being
#                          silently swapped for one another.
#   authority              the body that published the figure
#   document_id            the specific document/decision, so "authority" alone
#                          is never the whole citation
#   edition_date           when that document was published
#   activity_year          the year the figure DESCRIBES (usually one year
#                          behind edition_date — the label always lags)
#   next_edition_expected  when a newer edition is due, so a figure can be
#                          checked for staleness without re-deriving the answer
#   path                   file:line (or a note) for where this id is consumed
#   status                 current | superseded | pending
#   supersedes             the id of the entry this one replaces, or null
#   verified_on            the date this entry was checked against the primary
#                          document itself, not a secondary summary
#   notes                  free text — only where a bare number would mislead
#
# basis values in use here:
#   supply_residual   — what a consumer with NO Guarantee of Origin actually
#                       draws, i.e. the grid's leftover mix. THE DEFAULT for a
#                       consumer-facing CO2-savings figure.
#   generation        — the national generation mix average. Never a consumer
#                       figure — context and comparison only. 258 vs 107 is a
#                       2.4x spread for the same country, same year, both
#                       official; using generation for a consumer overstates
#                       their real saving.
#   supply_attributed — a consumer ON a redeemed Guarantee of Origin. Not
#                       automatically zero: es-carbon-supply-attributed-cogen-2025
#                       is 302 g/kWh, dirtier than the no-GdO default.

entries:
  # ── Spain, electricity carbon intensity ──────────────────────────────────
  - id: es-carbon-supply-residual-2025
    value: 258
    unit: gCO2eq/kWh
    basis: supply_residual
    authority: "CNMC (Comisión Nacional de los Mercados y la Competencia), Sala de Supervisión Regulatoria"
    document_id: "Acuerdo GDO/DE/001/26 — Etiquetado de la electricidad relativo a la energía producida en el año 2025"
    edition_date: "2026-04-28"
    activity_year: 2025
    next_edition_expected: "2027-05 (approximate — CNMC publishes the following year's label after retailer mixes are filed; corroborated independently by MITECO's Guía para el cálculo de la huella de carbono, May 2026 edition)"
    path: "artifacts/api-server/src/lib/emissions/es.ts"
    status: current
    supersedes: es-carbon-supply-residual-2024-miteo
    verified_on: "2026-09-15"
    notes: >
      Mix Residual Final — the generic retailer without Guarantees of Origin.
      This is THE consumer default: a consumer whose retailer is unknown or
      unattributed. The full per-retailer range in the same document's Anexo I
      runs 0 to 259 g/kWh for the same country, same grid, same year — a
      single constant is wrong against at least one real retailer no matter
      which value is chosen. Per-retailer resolution is out of scope for this
      block (H-SRC-ES scope fence): the shape below (basis, per-entity id) is
      built so adding one is cheap later, not built now.

  - id: es-carbon-supply-residual-2024-miteo
    value: 283
    unit: gCO2eq/kWh
    basis: supply_residual
    authority: "MITECO (Ministerio para la Transición Ecológica y el Reto Demográfico)"
    document_id: "MITECO official workbook, revised 7 May 2026 — Mix sin GdO, series back to 2007"
    edition_date: "2026-05-07"
    activity_year: 2024
    next_edition_expected: null
    path: "superseded — was a bare literal at contracts/blocks/h1b.md:11 (0.283 kg CO2e/kWh), never landed in application code"
    status: superseded
    supersedes: null
    verified_on: "2026-09-15"
    notes: >
      Documented by MITECO as 0.283 kg CO2e/kWh; recorded here in g/kWh
      (283 g/kWh) for unit consistency with the rest of this registry — same
      number, same source, unit restated only. This is the exact figure
      H-SRC-ES exists to stop being quietly rolled forward: superseding it
      with a bare 0.258 next year would reproduce the defect this block
      removes. It stays in the registry, marked superseded, rather than being
      deleted, so the history is queryable instead of living only in git log.

